{% extends "base/base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-6 col-md-offset-3">
            <div class="panel panel-default">
                <div class="panel-heading">
                    <h3 class="panel-title"><i class="glyphicon glyphicon-log-in"></i> Login to IGOR</h3>
                </div>
                <div class="panel-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="{{ form.username.id_for_label }}">Username:</label>
                            {{ form.username }}
                            <script>document.getElementById('id_username').className = 'form-control';</script>
                        </div>
                        <div class="form-group">
                            <label for="{{ form.password.id_for_label }}">Password:</label>
                            {{ form.password }}
                            <script>document.getElementById('id_password').className = 'form-control';</script>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">
                            <i class="glyphicon glyphicon-log-in"></i> Login
                        </button>
                    </form>
                    <hr>
                    <div class="text-center">
                        <p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
